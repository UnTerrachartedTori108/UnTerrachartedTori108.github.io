<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 11</title>
  <style>
    :root {
      --bg: #000000;
      --text: #f3f3f3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem 2rem;
    }

    .artwork {
      width: min(100vw - 2rem, 1200px);
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      align-items: start;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 5vw, 9rem);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -0.08em;
    }

    img {
      display: block;
      width: min(86vw, 900px);
      max-width: 100%;
      height: auto;
      justify-self: center;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="artwork">
    <h1>Raster</h1>
    <img src="raster.jpg" alt="Black and white concentric circle artwork">
  </div>
</body>
</html>
